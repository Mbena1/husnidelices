<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Thème du navigateur et de l'application -->
    <meta name="theme-color" content="#3D2817" />

    <!-- Favicon navigateur -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />

    <!-- Icône pour iPhone / iPad -->
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/icons/icon-192.png"
    />

    <!-- PWA / Android -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Husnidélices"
    />

    <!-- Description -->
    <meta
      name="description"
      content="Husnidélices — Pâtisserie artisanale au Bénin. Découvrez nos gâteaux, cupcakes, pièces montées et créations personnalisées."
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Husnidélices — Pâtisserie au Bénin"
    />

    <meta
      property="og:description"
      content="Découvrez les créations pâtissières de Husnidélices au Bénin."
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <title>Husnidélices — Pâtisserie au Bénin</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
